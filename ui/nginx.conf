server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types      text/css text/plain application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Cache policy is set with `expires` rather than `add_header Cache-Control`
    # on purpose: an add_header inside a location discards every add_header
    # inherited from the server block, which would silently strip the security
    # headers above from exactly the responses that carry the app.

    # Vite fingerprints these filenames, so a cached copy can never go stale.
    # =404 rather than the SPA fallback below: a chunk missing because the client is
    # holding a stale index.html should say so, not hand back HTML that the browser
    # then tries to parse as JavaScript.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html is what points at those fingerprinted files. Cache it and a
    # deploy stays invisible until the browser decides to look again.
    location = /index.html {
        expires -1;
    }

    # /history, /faucet and /sessions exist only in the React router, so a direct
    # hit or a refresh on one has to be answered with index.html, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
