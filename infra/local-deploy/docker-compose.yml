# Full local stack. PostgreSQL + RabbitMQ come from docker-compose-deps.yml (imported below,
# and reused on its own by the e2e suite / CI); this file adds observability and the UI.
#
#   docker compose -f infra/local-deploy/docker-compose.yml up -d

include:
  - docker-compose-deps.yml

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    # api and core run on the host (make run); host-gateway lets Prometheus reach them via
    # host.docker.internal (see prometheus.yml). RabbitMQ is scraped in-network as rabbitmq:15692.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      rabbitmq:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "10000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  ui:
    image: node:22-alpine
    container_name: me-ui
    working_dir: /workspace/ui
    # api runs on the host too (make run), so the default connection
    # settings baked into the FE (localhost:4000, see ui/src/config.ts)
    # reach it fine from the browser without extra env vars here.
    ports:
      - "5173:5173"
    volumes:
      # This compose file now lives at infra/local-deploy/, so the repo root is two up.
      - ../../ui:/workspace/ui
      # ts-sdk is imported straight from source (see ui/vite.config.ts
      # alias) — no build step, just needs to be present on the same
      # relative path as on the host.
      - ../../ts-sdk:/workspace/ts-sdk
      # Named volume so container-installed (musl/alpine) native deps
      # never overwrite the host's own node_modules, and vice versa.
      - ui_node_modules:/workspace/ui/node_modules
    command: sh -c "npm ci && npm run dev -- --host"

volumes:
  ui_node_modules:
