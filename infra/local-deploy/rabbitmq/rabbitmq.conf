management.tcp.port = 15672

prometheus.tcp.port = 15692

# Per-queue labels on the /metrics endpoint. Off by default because label cardinality grows with
# the number of queues; this deployment has two per market (the command queue and its dead-letter
# parking lot), so the cost is negligible and the breakdown is what makes queue depth actionable —
# "3 messages parked" is only useful if you know which market parked them.
prometheus.return_per_object_metrics = true
